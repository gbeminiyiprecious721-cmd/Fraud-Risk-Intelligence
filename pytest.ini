[pytest]
markers =
    heavy: full-training, multi-minute tests that fit a real model on the complete train partition (e.g. Stage 13's independent regression-equivalence check). Not run by default -- see docs/STAGE16_AUTOMATED_TESTING_REPORT.md for exact commands.
    data_contract_full: comprehensive full-train-partition data-contract scans (Stage 16). Slower than the fast register/header-level checks in the same file. Not run by default -- see docs/STAGE16_AUTOMATED_TESTING_REPORT.md for exact commands.
